name: One-time image upload flow fix

on:
  push:
    paths:
      - 'src/image-upload-fix.trigger'
      - 'src/management.ts'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[image-flow-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply image flow fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/management.ts')
          s = p.read_text()
          old = '''    const path = imagePath(item, optimizedFile, imageList(item).length);\n    await putAsset(path, await fileToBase64(optimizedFile));\n    const nextImages = [...imageList(item), imageMeta(item, path, item.title)];\n    try { await saveImages(item, nextImages); } catch (error) { try { await deleteAsset(path); } catch {} throw error; }\n    showToast(nextImages.length === 1 ? '圖片已上傳並設為主圖。' : '圖片已上傳。', 'success');'''
          new = '''    const path = imagePath(item, optimizedFile, imageList(item).length);\n    const result = await putAsset(path, await fileToBase64(optimizedFile));\n    showToast(result.replaced ? '圖片已替換。' : '圖片已上傳並同步。', 'success');'''
          if old not in s:
              raise SystemExit('uploadImage target not found')
          s = s.replace(old, new, 1)
          old = '''    const previousContent = await blobToBase64(await getAsset(currentPath));\n    const optimizedFile = await optimizeImage(file);\n    const path = imagePath(item, optimizedFile, index);\n    await putAsset(path, await fileToBase64(optimizedFile));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) { try { await putAsset(currentPath, previousContent); } catch { throw new Error('圖片 metadata 更新失敗，且舊圖片回復失敗，請立即重新載入資料確認。'); } if (path !== currentPath) { try { await deleteAsset(path); } catch {} } throw error; }\n    if (path !== currentPath) {\n      try { await deleteAsset(currentPath); } catch { showToast('新圖片已套用，但舊圖片清理失敗。', 'error'); }\n    }\n    showToast('圖片已成功替換。', 'success');'''
          new = '''    const optimizedFile = await optimizeImage(file);\n    const path = imagePath(item, optimizedFile, index);\n    await putAsset(path, await fileToBase64(optimizedFile));\n    if (path !== currentPath) {\n      try { await deleteAsset(currentPath); } catch { showToast('新圖片已套用，但舊圖片清理失敗。', 'error'); }\n    }\n    showToast('圖片已成功替換。', 'success');'''
          if old not in s:
              raise SystemExit('replaceImage target not found')
          s = s.replace(old, new, 1)
          old = '''  const originalImages = imageList(item); const nextImages = normalizeCover(originalImages.filter(entry => entry.id !== imageId));\n  try {\n    await saveImages(item, nextImages);\n    try { await deleteAsset(`data/${item.workId}/${item.category}/${item.id}/images/${image.file}`); }\n    catch (deleteError) { try { await saveImages(item, originalImages); } catch { throw new Error('圖片檔案刪除失敗，且 metadata rollback 也失敗，請立即重新載入資料確認。'); } throw deleteError; }\n    showToast('圖片已刪除。', 'success');'''
          new = '''  try {\n    await deleteAsset(`data/${item.workId}/${item.category}/${item.id}/images/${image.file}`);\n    showToast('圖片已刪除。', 'success');'''
          if old not in s:
              raise SystemExit('deleteImage target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          for path in ['package.json', 'public/data/version.json']:
              p = Path(path)
              s = p.read_text().replace('1.109.681', '1.109.682')
              p.write_text(s)
          p = Path('TODO.md')
          s = p.read_text().replace('目前開發版本：`1.109.675`。', '目前開發版本：`1.109.682`。')
          s = s.replace('- [ ] 確認正式 Worker 的實際部署版本與正式網站圖片 PUT 行為，不把 GitHub 資料版本與 Worker 程式版本混為一談。', '- [x] 確認正式 Worker 的實際部署版本與正式網站圖片 PUT 行為，不把 GitHub 資料版本與 Worker 程式版本混為一談。')
          s = s.replace('- [ ] 前端圖片 API 錯誤現在會顯示 Worker version、API error code 與 HTTP status，下一次實測用這些資訊直接定位失敗階段。', '- [x] 前端圖片 API 錯誤現在會顯示 Worker version、API error code 與 HTTP status，下一次實測用這些資訊直接定位失敗階段。')
          s = s.replace('- [ ] Worker 的 R2 mirror → GitHub mutation chain 需完成正式驗收：小圖、接近 8 MB 圖片、替換既有圖片。', '- [ ] Worker 的 R2 mirror → GitHub mutation chain 需完成正式驗收：小圖、接近 8 MB 圖片、替換既有圖片。')
          p.write_text(s)
          PY
          rm -f src/image-upload-fix.trigger .github/workflows/image-upload-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/management.ts package.json public/data/version.json TODO.md src/image-upload-fix.trigger .github/workflows/image-upload-fix-once.yml
          git commit -m 'fix: make image asset mutations atomic [image-flow-fix]'
          git push
