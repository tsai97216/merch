name: Fix image replace rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/image-replace-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    if: hashFiles('.github/image-replace-fix-trigger') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/management.ts')
          s = p.read_text()
          old = "async function fileToBase64(file: File): Promise<string> { return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = () => reject(new Error('圖片讀取失敗。')); reader.onload = () => { const text = String(reader.result ?? ''); const comma = text.indexOf(','); if (comma < 0) reject(new Error('圖片資料格式無效。')); else resolve(text.slice(comma + 1)); }; reader.readAsDataURL(file); }); }"
          new = old + "\nasync function blobToBase64(blob: Blob): Promise<string> { const buffer = await blob.arrayBuffer(); const bytes = new Uint8Array(buffer); let binary = ''; const chunkSize = 0x8000; for (let index = 0; index < bytes.length; index += chunkSize) binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize)); return btoa(binary); }"
          if old not in s: raise SystemExit('fileToBase64 anchor not found')
          s = s.replace(old, new, 1)
          old2 = "  imageSaving = true; render(); showToast('圖片替換同步中，請稍候。', 'info');\n  const path = imagePath(item, file, index);\n  try {\n    await putAsset(path, await fileToBase64(file));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) { try { if (path !== `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`) await deleteAsset(path); } catch {} throw error; }\n    const currentPath = `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`;\n    if (path !== currentPath) {\n      try { await deleteAsset(currentPath); } catch { showToast('新圖片已套用，但舊圖片清理失敗。', 'error'); }\n    }\n    showToast('圖片已成功替換。', 'success');"
          new2 = "  imageSaving = true; render(); showToast('圖片替換同步中，請稍候。', 'info');\n  const path = imagePath(item, file, index);\n  const currentPath = `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`;\n  let previousContent = '';\n  try {\n    previousContent = await blobToBase64(await getAsset(currentPath));\n    await putAsset(path, await fileToBase64(file));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) {\n      try { await putAsset(currentPath, previousContent); } catch { throw new Error('圖片 metadata 更新失敗，且舊圖片回復失敗，請立即重新載入資料確認。'); }\n      if (path !== currentPath) { try { await deleteAsset(path); } catch {} }\n      throw error;\n    }\n    if (path !== currentPath) {\n      try { await deleteAsset(currentPath); } catch { showToast('新圖片已套用，但舊圖片清理失敗。', 'error'); }\n    }\n    showToast('圖片已成功替換。', 'success');"
          if old2 not in s: raise SystemExit('replaceImage anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['package.json', 'public/data/version.json']:
              p = Path(name); data = json.loads(p.read_text())
              if name == 'package.json': data['version'] = '1.109.412'
              else: data['version'] = '1.109.412'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          p = Path('TODO.md')
          s = p.read_text()
          s = s.replace('`1.109.411`', '`1.109.412`', 1)
          marker = '- [x] 統一圖片檔名規則：新上傳／替換圖片以完整 Item ID 為基準，第一張使用 `<Item ID>.<ext>`，同一 Item 的其他圖片使用 `<Item ID>-2.<ext>`、`<Item ID>-3.<ext>` 等序號後綴。'
          note = marker + '\n- [x] 修正圖片替換交易：metadata 更新失敗時會以原圖片內容回復，避免同一路徑覆蓋後無法 rollback。'
          if marker not in s: raise SystemExit('TODO marker not found')
          s = s.replace(marker, note, 1)
          p.write_text(s)
          PY

          rm .github/image-replace-fix-trigger
          rm .github/workflows/fix-image-replace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/management.ts TODO.md package.json public/data/version.json .github
          git commit -m 'fix: make image replacement rollback-safe (1.109.412)'
          git push
