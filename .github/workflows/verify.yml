name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Migrate New Storage]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify CI contract
        run: npm run verify:ci-contract
      - name: Verify data integrity
        run: npm run verify
      - name: Verify new storage layout
        run: npm run verify:new
      - name: Verify migration completion
        run: npm run verify:migration
      - name: Verify Item schema contract
        run: npm run verify:schema
      - name: Verify legacy runtime fields are absent
        run: npm run verify:legacy-fields
      - name: Verify category contract
        run: npm run verify:category
      - name: Verify image contract
        run: npm run verify:images
      - name: Verify validation boundary contract
        run: npm run verify:validation
      - name: Verify worker validation contract
        run: npm run verify:worker-validation
      - name: Verify management schema contract
        run: npm run verify:management-schema
      - name: Verify works management CRUD contract
        run: npm run verify:works-management
      - name: Verify lifecycle contract
        run: npm run verify:lifecycle
      - name: Verify worker architecture
        run: npm run verify:worker
      - name: Verify worker write scope
        run: npm run verify:worker-scope
      - name: Verify worker target read scope
        run: npm run verify:worker-read
      - name: Verify worker image mutation semantics
        run: npm run verify:worker-image
      - name: Verify worker transaction semantics
        run: npm run verify:worker-transaction
      - name: Verify API load and fallback contract
        run: npm run verify:api-load
      - name: Verify API mutation contract
        run: npm run verify:api-mutation
      - name: Verify Work identity contract
        run: npm run verify:work-identity
      - name: Verify Home ranking contract
        run: npm run verify:home-ranking
      - name: Verify statistics date boundaries
        run: npm run verify:statistics
      - name: Verify statistics year isolation
        run: npm run verify:statistics-year
      - name: Verify statistics year contract
        run: npm run verify:statistics-contract
      - name: Verify version consistency
        run: npm run verify:version
      - name: TypeScript and Vite build
        run: npm run build
