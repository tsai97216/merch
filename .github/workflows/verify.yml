name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Migrate New Storage]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify data integrity
        run: npm run verify
      - name: Verify new storage layout
        run: npm run verify:new
      - name: Verify migration completion
        run: npm run verify:migration
      - name: Verify Item schema contract
        run: npm run verify:schema
      - name: Verify legacy runtime fields are absent
        run: npm run verify:legacy-fields
      - name: Verify category contract
        run: npm run verify:category
      - name: Verify image contract
        run: npm run verify:images
      - name: Verify management schema contract
        run: npm run verify:management-schema
      - name: Verify works management CRUD contract
        run: npm run verify:works-management
      - name: Verify worker architecture
        run: npm run verify:worker
      - name: Verify worker write scope
        run: npm run verify:worker-scope
      - name: Verify worker target read scope
        run: npm run verify:worker-read
      - name: Verify worker image mutation semantics
        run: npm run verify:worker-image
      - name: Verify worker transaction semantics
        run: npm run verify:worker-transaction
      - name: Verify API load and fallback contract
        run: npm run verify:api-load
      - name: Verify version consistency
        run: npm run verify:version
      - name: Verify statistics date boundaries
        run: npm run verify:statistics
      - name: TypeScript and Vite build
        run: npm run build
      - name: Apply pending image optimization change
        if: ${{ hashFiles('.github/image-optimize-fix-trigger') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          management = Path('src/management.ts')
          text = management.read_text()
          text = text.replace("import { putAsset, deleteAsset } from './api';", "import { getAsset, putAsset, deleteAsset } from './api';", 1)
          old = """async function fileToBase64(file: File): Promise<string> { return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = () => reject(new Error('圖片讀取失敗。')); reader.onload = () => { const text = String(reader.result ?? ''); const comma = text.indexOf(','); if (comma < 0) reject(new Error('圖片資料格式無效。')); else resolve(text.slice(comma + 1)); }; reader.readAsDataURL(file); }); }\nfunction imageMeta"""
          new = """async function fileToBase64(file: File): Promise<string> { return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = () => reject(new Error('圖片讀取失敗。')); reader.onload = () => { const text = String(reader.result ?? ''); const comma = text.indexOf(','); if (comma < 0) reject(new Error('圖片資料格式無效。')); else resolve(text.slice(comma + 1)); }; reader.readAsDataURL(file); }); }\nasync function blobToBase64(blob: Blob): Promise<string> { const bytes = new Uint8Array(await blob.arrayBuffer()); let binary = ''; for (let offset = 0; offset < bytes.length; offset += 0x8000) binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000)); return btoa(binary); }\nasync function optimizeImage(file: File): Promise<File> { if (file.type !== 'image/jpeg') return file; const url = URL.createObjectURL(file); try { const image = await new Promise<HTMLImageElement>((resolve, reject) => { const element = new Image(); element.onload = () => resolve(element); element.onerror = () => reject(new Error('圖片讀取失敗。')); element.src = url; }); const maxDimension = 2400; const needsResize = Math.max(image.naturalWidth, image.naturalHeight) > maxDimension; if (!needsResize && file.size <= 1024 * 1024) return file; const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight)); const width = Math.max(1, Math.round(image.naturalWidth * scale)); const height = Math.max(1, Math.round(image.naturalHeight * scale)); const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; const context = canvas.getContext('2d'); if (!context) throw new Error('圖片壓縮功能無法初始化。'); context.drawImage(image, 0, 0, width, height); const blob = await new Promise<Blob>((resolve, reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error('圖片壓縮失敗。')), 'image/jpeg', 0.85)); return new File([blob], file.name.replace(/\\.(?:jpe?g)$/i, '.jpg'), { type: 'image/jpeg', lastModified: file.lastModified }); } finally { URL.revokeObjectURL(url); } }\nfunction imageMeta"""
          if old not in text: raise SystemExit('helper anchor not found')
          text = text.replace(old, new, 1)
          old = """  const path = imagePath(item, file, imageList(item).length);\n  try {\n    await putAsset(path, await fileToBase64(file));"""
          new = """  try {\n    const optimizedFile = await optimizeImage(file);\n    const path = imagePath(item, optimizedFile, imageList(item).length);\n    await putAsset(path, await fileToBase64(optimizedFile));"""
          if old not in text: raise SystemExit('upload anchor not found')
          text = text.replace(old, new, 1)
          old = """  const path = imagePath(item, file, index);\n  try {\n    await putAsset(path, await fileToBase64(file));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) { try { if (path !== `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`) await deleteAsset(path); } catch {} throw error; }\n    const currentPath = `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`;"""
          new = """  const currentPath = `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`;\n  try {\n    const previousContent = await blobToBase64(await getAsset(currentPath));\n    const optimizedFile = await optimizeImage(file);\n    const path = imagePath(item, optimizedFile, index);\n    await putAsset(path, await fileToBase64(optimizedFile));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) { try { await putAsset(currentPath, previousContent); } catch { throw new Error('圖片 metadata 更新失敗，且舊圖片回復失敗，請立即重新載入資料確認。'); } if (path !== currentPath) { try { await deleteAsset(path); } catch {} } throw error; }"""
          if old not in text: raise SystemExit('replace anchor not found')
          text = text.replace(old, new, 1)
          management.write_text(text)
          for path in ['package.json', 'public/data/version.json']:
              p = Path(path); p.write_text(p.read_text().replace('1.109.411', '1.109.412'))
          todo = Path('TODO.md'); t = todo.read_text().replace('**目前開發版本：`1.109.411`。**', '**目前開發版本：`1.109.412`。**', 1)
          marker = '- [x] 完成圖片全量重置：清空既有圖片 metadata、分類 cover、GitHub 圖片檔案與 R2 圖片物件，重新從零建立圖片資料。'
          addition = marker + "\n- [x] 修正圖片替換交易：metadata 更新失敗時會以原圖片內容回復，避免同一路徑覆蓋後無法 rollback。\n- [x] Management 圖片新增／替換加入瀏覽器端 JPEG 最佳化：長邊最多 2400px、品質 85%，大型照片先壓縮後再上傳；PNG／WebP／GIF／AVIF 維持原格式。"
          if marker not in t: raise SystemExit('TODO anchor not found')
          todo.write_text(t.replace(marker, addition, 1))
          PY
          npm run verify
          npm run build
          rm -f .github/image-optimize-fix-trigger .github/workflows/image-optimize-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/management.ts package.json public/data/version.json TODO.md .github/workflows/verify.yml .github/image-optimize-fix-trigger .github/workflows/image-optimize-fix.yml
          git commit -m 'fix: optimize browser image uploads (1.109.412)'
          git push origin HEAD:main
