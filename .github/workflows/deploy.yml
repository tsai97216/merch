name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Migrate New Storage]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    needs: build
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Worker R2 bucket exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler@4 r2 bucket list --format json | jq -e '.[] | select(.name == "chi-merch-assets")' >/dev/null; then
            echo 'R2 bucket chi-merch-assets already exists.'
          else
            echo 'Creating R2 bucket chi-merch-assets.'
            npx wrangler@4 r2 bucket create chi-merch-assets
          fi

      - name: Validate Worker GitHub Token
        env:
          MERCH_GITHUB_TOKEN: ${{ secrets.MERCH_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MERCH_GITHUB_TOKEN" ]; then
            echo 'MERCH_GITHUB_TOKEN is not configured.'
            exit 1
          fi
          permissions=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MERCH_GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tsai97216/merch | jq -r '.permissions.push // false')
          if [ "$permissions" != 'true' ]; then
            echo 'MERCH_GITHUB_TOKEN does not have GitHub contents write permission for tsai97216/merch.'
            exit 1
          fi
          echo 'Worker GitHub token has repository write permission.'

      - name: Set Worker GitHub Token
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCH_GITHUB_TOKEN: ${{ secrets.MERCH_GITHUB_TOKEN }}
        run: printf '%s' "$MERCH_GITHUB_TOKEN" | npx wrangler@4 secret put GITHUB_TOKEN

      - name: Set Worker Admin Secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCH_ADMIN_SECRET: ${{ secrets.MERCH_ADMIN_SECRET }}
        run: printf '%s' "$MERCH_ADMIN_SECRET" | npx wrangler@4 secret put ADMIN_SECRET

      - name: Verify Worker Secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets=$(npx wrangler@4 secret list --format json)
          echo "$secrets" | jq -e 'map(.name) | index("GITHUB_TOKEN")' >/dev/null
          echo "$secrets" | jq -e 'map(.name) | index("ADMIN_SECRET")' >/dev/null
          echo 'Worker secrets are configured.'

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
