name: Apply image optimization fix

on:
  push:
    branches: [main]
    paths:
      - '.github/image-optimize-fix-trigger'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/image-optimize-fix-trigger') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply image optimization and rollback fix
        env:
          VERSION: 1.109.412
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          management = Path('src/management.ts')
          text = management.read_text()

          old_helpers = """async function fileToBase64(file: File): Promise<string> { return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = () => reject(new Error('圖片讀取失敗。')); reader.onload = () => { const text = String(reader.result ?? ''); const comma = text.indexOf(','); if (comma < 0) reject(new Error('圖片資料格式無效。')); else resolve(text.slice(comma + 1)); }; reader.readAsDataURL(file); }); }\nfunction imageMeta"""
          new_helpers = """async function fileToBase64(file: File): Promise<string> { return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = () => reject(new Error('圖片讀取失敗。')); reader.onload = () => { const text = String(reader.result ?? ''); const comma = text.indexOf(','); if (comma < 0) reject(new Error('圖片資料格式無效。')); else resolve(text.slice(comma + 1)); }; reader.readAsDataURL(file); }); }\nasync function blobToBase64(blob: Blob): Promise<string> { const bytes = new Uint8Array(await blob.arrayBuffer()); let binary = ''; for (let offset = 0; offset < bytes.length; offset += 0x8000) binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000)); return btoa(binary); }\nasync function optimizeImage(file: File): Promise<File> {\n  if (file.type !== 'image/jpeg') return file;\n  const url = URL.createObjectURL(file);\n  try {\n    const image = await new Promise<HTMLImageElement>((resolve, reject) => { const element = new Image(); element.onload = () => resolve(element); element.onerror = () => reject(new Error('圖片讀取失敗。')); element.src = url; });\n    const maxDimension = 2400;\n    const needsResize = Math.max(image.naturalWidth, image.naturalHeight) > maxDimension;\n    if (!needsResize && file.size <= 1024 * 1024) return file;\n    const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));\n    const width = Math.max(1, Math.round(image.naturalWidth * scale));\n    const height = Math.max(1, Math.round(image.naturalHeight * scale));\n    const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;\n    const context = canvas.getContext('2d'); if (!context) throw new Error('圖片壓縮功能無法初始化。');\n    context.drawImage(image, 0, 0, width, height);\n    const blob = await new Promise<Blob>((resolve, reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error('圖片壓縮失敗。')), 'image/jpeg', 0.85));\n    return new File([blob], file.name.replace(/\\.(?:jpe?g)$/i, '.jpg'), { type: 'image/jpeg', lastModified: file.lastModified });\n  } finally { URL.revokeObjectURL(url); }\n}\nfunction imageMeta"""
          if old_helpers not in text:
              raise SystemExit('management helper anchor not found')
          text = text.replace(old_helpers, new_helpers, 1)

          old_upload = """  const path = imagePath(item, file, imageList(item).length);\n  try {\n    await putAsset(path, await fileToBase64(file));"""
          new_upload = """  try {\n    const optimizedFile = await optimizeImage(file);\n    const path = imagePath(item, optimizedFile, imageList(item).length);\n    await putAsset(path, await fileToBase64(optimizedFile));"""
          if old_upload not in text:
              raise SystemExit('upload anchor not found')
          text = text.replace(old_upload, new_upload, 1)

          old_replace = """  const path = imagePath(item, file, index);\n  try {\n    await putAsset(path, await fileToBase64(file));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) { try { if (path !== `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`) await deleteAsset(path); } catch {} throw error; }\n    const currentPath = `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`;"""
          new_replace = """  const currentPath = `data/${item.workId}/${item.category}/${item.id}/images/${current.file}`;\n  try {\n    const previousContent = await blobToBase64(await getAsset(currentPath));\n    const optimizedFile = await optimizeImage(file);\n    const path = imagePath(item, optimizedFile, index);\n    await putAsset(path, await fileToBase64(optimizedFile));\n    const nextImages = images.map(image => image.id === imageId ? imageMeta(item, path, image.alt || item.title, image.id, image.isCover === true) : image);\n    try { await saveImages(item, nextImages); } catch (error) {\n      try { await putAsset(currentPath, previousContent); } catch { throw new Error('圖片 metadata 更新失敗，且舊圖片回復失敗，請立即重新載入資料確認。'); }\n      if (path !== currentPath) { try { await deleteAsset(path); } catch {} }\n      throw error;\n    }"""
          if old_replace not in text:
              raise SystemExit('replace anchor not found')
          text = text.replace(old_replace, new_replace, 1)
          management.write_text(text)

          for path in ['package.json', 'public/data/version.json']:
              p = Path(path); t = p.read_text(); t = t.replace('1.109.411', '1.109.412'); p.write_text(t)

          todo = Path('TODO.md'); t = todo.read_text(); t = t.replace('**目前開發版本：`1.109.411`。**', '**目前開發版本：`1.109.412`。**', 1)
          marker = '- [x] 完成圖片全量重置：清空既有圖片 metadata、分類 cover、GitHub 圖片檔案與 R2 圖片物件，重新從零建立圖片資料。'
          additions = marker + "\n- [x] 修正圖片替換交易：metadata 更新失敗時會以原圖片內容回復，避免同一路徑覆蓋後無法 rollback。\n- [x] Management 圖片新增／替換加入瀏覽器端 JPEG 最佳化：長邊最多 2400px、品質 85%，大型照片先壓縮後再上傳；PNG／WebP／GIF／AVIF 維持原格式。"
          if marker not in t:
              raise SystemExit('TODO image reset anchor not found')
          t = t.replace(marker, additions, 1)
          todo.write_text(t)
          PY

      - name: Verify
        run: |
          npm install
          npm run verify
      - name: Build
        run: npm run build
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/image-optimize-fix-trigger .github/workflows/image-optimize-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/management.ts package.json public/data/version.json TODO.md .github
          git commit -m 'fix: optimize browser image uploads (1.109.412)'
          git push origin main
