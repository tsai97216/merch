name: Refresh Lockfile Metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'tsai97216'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Sync TODO version note
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'TODO.md';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace('目前開發版本：`1.109.639`。', '目前開發版本：`1.109.640`。');
          text = text.replace('且 root version 與 `package.json` 均為 `1.109.638`。', '且 root version 與 `package.json` 均為 `1.109.640`。');
          fs.writeFileSync(path, text);
          NODE

      - name: Remove one-time workflow
        run: git rm .github/workflows/refresh-lockfile.yml

      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json TODO.md
          git commit -m 'chore: synchronize lockfile metadata for 1.109.640'
          git push
