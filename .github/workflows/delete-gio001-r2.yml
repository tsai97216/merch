name: Delete GIo001 R2 Object

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-gio001-r2.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete GIo001 image from R2
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 r2 object delete chi-merch-assets/data/genshin-impact/o/GIo001/images/GIo001.jpg --remote

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/delete-gio001-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/delete-gio001-r2.yml
          git commit -m 'chore: remove one-time GIo001 R2 cleanup'
          git push origin HEAD:main
