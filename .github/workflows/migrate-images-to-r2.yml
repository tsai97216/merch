name: Migrate Images to R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/r2-migration-trigger'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure Worker R2 bucket exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bucket_list="$(npx wrangler@4 r2 bucket list 2>&1)"
          printf '%s\n' "$bucket_list"
          if printf '%s\n' "$bucket_list" | grep -Eq '(^|[[:space:]])chi-merch-assets([[:space:]]|$)'; then
            echo 'R2 bucket chi-merch-assets already exists.'
          else
            echo 'R2 bucket chi-merch-assets not found. Creating it.'
            npx wrangler@4 r2 bucket create chi-merch-assets
          fi

      - name: Upload all repository images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: chi-merch-assets
        run: node scripts/migrate-images-to-r2.mjs
