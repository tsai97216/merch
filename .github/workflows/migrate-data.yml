name: Migrate merch-old data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Checkout merch-old
        uses: actions/checkout@v4
        with:
          repository: tsai97216/merch-old
          ref: main
          path: ../merch-old

      - name: Install dependencies
        run: npm install

      - name: Run migration and SHA verification
        run: npm run migrate

      - name: Commit migrated data and images
        run: |
          if git diff --quiet && git ls-files --others --exclude-standard | grep -q .; then
            :
          elif git diff --quiet; then
            echo "No migration changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data tools/migration-result.json
          git diff --cached --quiet && echo "No staged migration changes." && exit 0
          git commit -m "data: migrate merch-old collection and images"
          git push origin main
