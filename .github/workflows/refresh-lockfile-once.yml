name: Refresh Lockfile Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'tsai97216'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Bump patch and sync metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const [major, minor, patch] = pkg.version.split('.').map(Number);
          pkg.version = `${major}.${minor}.${patch + 1}`;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          const version = pkg.version;
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          fs.writeFileSync('public/data/version.json', JSON.stringify({ version }) + '\n');
          const todoPath = 'TODO.md';
          let todo = fs.readFileSync(todoPath, 'utf8');
          todo = todo.replace(/目前開發版本：`[^`]+`。/, `目前開發版本：\`${version}\`。`);
          fs.writeFileSync(todoPath, todo);
          NODE
      - name: Remove one-time workflow
        run: git rm .github/workflows/refresh-lockfile-once.yml
      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/data/version.json TODO.md
          git commit -m "chore: refresh lockfile and bump version"
          git push
