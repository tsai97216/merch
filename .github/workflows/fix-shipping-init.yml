name: Fix shipping initial load
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-shipping-init.py'
      - '.github/workflows/fix-shipping-init.yml'
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip shipping]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-shipping-init.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix-shipping-init.py .github/workflows/fix-shipping-init.yml
          git add .
          git commit -m 'fix: load shipping records on startup [skip shipping]'
          git push
