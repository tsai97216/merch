name: Remove legacy statistics charts
on:
  push:
    paths:
      - '.github/workflows/remove-legacy-statistics.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy chart rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/main.ts')
          s = p.read_text()
          pattern = r'function renderStatistics\(store: MerchStore\) \{.*?\nlet detailModal:'
          replacement = "function renderStatistics(store: MerchStore) { const { items } = store.snapshot; const total = items.reduce((sum, item) => sum + quantityOf(item), 0); const pending = items.filter((i) => i.status !== 'received').reduce((sum, item) => sum + quantityOf(item), 0); const spending = items.reduce((s, i) => s + itemValue(i), 0); const set = (k: string, v: string) => { const e = $<HTMLElement>(`[data-stat=\"${k}\"]`); if (e) e.textContent = v; }; set('total', String(total)); set('pending', String(pending)); set('spending', money(spending)); }\nlet detailModal:"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one renderStatistics block, found {n}')
          p.write_text(s2)
          PY
      - name: Bump version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('public/data/version.json')
          data = json.loads(p.read_text())
          major, minor, patch = map(int, data['version'].split('.'))
          data['version'] = f'{major}.{minor}.{patch + 1}'
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts public/data/version.json
          git diff --cached --quiet || git commit -m 'remove legacy statistics charts'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/remove-legacy-statistics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/remove-legacy-statistics.yml
          git diff --cached --quiet || git commit -m 'remove temporary cleanup workflow'
          git push
